<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>친환경 음식 2인 대결 · 50문제</title><style>
body{font-family:Arial,sans-serif;background:#eaf7ed;margin:0}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;padding:25px;border-radius:22px;box-shadow:0 8px 25px #0001}h1{text-align:center}.hidden{display:none}.score{display:flex;justify-content:space-around;background:#f1f7f2;padding:14px;border-radius:14px;margin:15px 0}.btn,.opt{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-size:16px}.btn{background:#43a047;color:white}.opt{background:#f2f5f3;text-align:left}.code{font-size:32px;text-align:center;font-weight:bold;letter-spacing:5px}.msg{text-align:center;padding:10px}.input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #bbb;border-radius:10px;margin:6px 0;font-size:16px}
</style></head><body><div class="wrap"><div class="card" id="home"><h1>🌱 친환경 음식 2인 대결</h1><input class="input" id="name" placeholder="내 이름"><button class="btn" onclick="create()">방 만들기</button><hr><input class="input" id="code" placeholder="방 코드 6자리"><button class="btn" onclick="join()">방 참가</button><div class="msg" id="msg"></div></div>
<div class="card hidden" id="room"><h2>대기실</h2><div class="code" id="roomCode"></div><p id="players">친구를 기다리는 중...</p><button class="btn hidden" id="start" onclick="start()">게임 시작</button></div>
<div class="card hidden" id="game"><div class="score"><span id="s1"></span><span id="s2"></span></div><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div class="msg" id="wait"></div></div>
<div class="card hidden" id="end"><h1>🏆 대결 종료!</h1><h2 id="winner" style="text-align:center"></h2><div class="score" id="final"></div><button class="btn" onclick="location.reload()">다시하기</button></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();let me="",host=false,qs=[],idx=0;
function show(id){document.querySelectorAll(".card").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function create(){me=document.getElementById("name").value.trim()||"플레이어1";socket.emit("createRoom",me)}
function join(){me=document.getElementById("name").value.trim()||"플레이어2";socket.emit("joinRoom",{code:document.getElementById("code").value.trim(),name:me})}
socket.on("roomCreated",d=>{host=true;document.getElementById("roomCode").textContent=d.code;show("room")});
socket.on("roomReady",d=>{document.getElementById("players").textContent=d.players.join("  ⚔️  ");if(host)document.getElementById("start").classList.remove("hidden")});
socket.on("joinError",d=>document.getElementById("msg").textContent=d.message);
function start(){socket.emit("startGame")}
socket.on("gameStart",d=>{qs=d.questions;idx=0;showQ()});
function showQ(){show("game");let x=qs[idx];document.getElementById("num").textContent=`문제 ${idx+1} / ${qs.length}`;document.getElementById("q").textContent=x[0];document.getElementById("wait").textContent="";let box=document.getElementById("opts");box.innerHTML="";x[1].forEach((o,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=`${["①","②","③","④"][i]} ${o}`;b.onclick=()=>{document.querySelectorAll(".opt").forEach(z=>z.disabled=true);document.getElementById("wait").textContent="상대방의 답을 기다리는 중...";socket.emit("answer",i)};box.appendChild(b)})}
socket.on("scoreUpdate",d=>{document.getElementById("s1").textContent=`${d.scores[0].name}: ${d.scores[0].score}점`;document.getElementById("s2").textContent=d.scores[1]?`${d.scores[1].name}: ${d.scores[1].score}점`:"상대방 대기"});
socket.on("nextQuestion",d=>{idx=d.index;showQ()});
socket.on("gameOver",d=>{show("end");let a=d.players;document.getElementById("final").innerHTML=`${a[0].name}: ${a[0].score}점　 vs　 ${a[1].name}: ${a[1].score}점`;document.getElementById("winner").textContent=a[0].score>a[1].score?`🎉 ${a[0].name} 승리!`:a[1].score>a[0].score?`🎉 ${a[1].name} 승리!`:"🤝 무승부!"});
socket.on("opponentLeft",()=>{show("home");document.getElementById("msg").textContent="상대방이 나갔습니다."});
</script></body></html>
